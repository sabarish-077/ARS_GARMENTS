<article class="product-card h-100">
  <a href="{{ product.get_absolute_url }}" class="product-image-link"><img src="{{ product.display_image_url }}" alt="{{ product.name }}" class="product-image" loading="lazy" onerror="this.onerror=null;this.src='/static/store/product-placeholder.svg'"><span class="product-tag">{{ product.category.name }}</span></a>
  <div class="product-info"><p class="eyebrow mb-1">{{ product.material|truncatechars:34 }}</p><h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3><p class="product-blurb">{{ product.short_description }}</p><div class="product-price"><strong>₹{{ product.price|floatformat:0 }}</strong>{% if product.compare_at_price %}<del>₹{{ product.compare_at_price|floatformat:0 }}</del>{% endif %}</div></div>
</article>
